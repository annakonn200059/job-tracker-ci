name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        # renovate: datasource=node-version depName=node
        default: "24"
      turbo-filter:
        description: 'Turborepo filter, e.g. "web..." — empty runs everything'
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      # Turborepo caches task output between runs keyed by input hashes,
      # so unchanged packages are skipped entirely.
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: npx turbo lint ${{ inputs.turbo-filter && format('--filter={0}', inputs.turbo-filter) || '' }}

      - name: Typecheck
        run: npx turbo typecheck ${{ inputs.turbo-filter && format('--filter={0}', inputs.turbo-filter) || '' }}

      - name: Build
        run: npx turbo build ${{ inputs.turbo-filter && format('--filter={0}', inputs.turbo-filter) || '' }}