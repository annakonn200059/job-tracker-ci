name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version to use
        type: string
        default: "1.26"
      working-directory:
        description: Directory containing go.mod
        type: string
        default: "."
      lint-timeout:
        type: string
        default: "5m"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # Fails if go.mod or go.sum would change — catches a forgotten `go mod tidy`.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ inputs.working-directory }}
          args: --timeout=${{ inputs.lint-timeout }}

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # -race catches the data races that make concurrency bugs
      # non-reproducible. Roughly 2-10x slower, worth it.
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # Compiles for the architecture the image will actually run on,
      # not the runner's default.
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o /dev/null ./...