name: Build image

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name under ghcr.io/<owner>/
        type: string
        required: true
      dockerfile:
        description: Dockerfile path, relative to context
        type: string
        default: Dockerfile
      context:
        description: Build context, relative to repo root
        type: string
        default: "."
      trivyignores:
        description: Path to a .trivyignore file, relative to repo root (optional)
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=sha,format=short,prefix=

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          # Without this, CVEs with no available patch fail the build forever
          # and you learn to ignore a permanently red pipeline.
          ignore-unfixed: true
          trivyignores: ${{ inputs.trivyignores }}

      - name: Push
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
          # Ask the registry for the digest; the local daemon's RepoDigests can
          # point at a different manifest depending on its image store.
          first_tag=$(echo "$TAGS" | head -n1)
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Could not resolve digest for $first_tag (got '$digest')"
            exit 1
          fi
          ref="${first_tag%:*}@${digest}"
          echo "digest=$ref" >> "$GITHUB_OUTPUT"
          echo "Pushed $ref"

      - name: Install cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$DIGEST"

      - name: Generate SBOM
        if: steps.push.outcome == 'success'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attest SBOM
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "$DIGEST"

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo '```'
            echo "$TAGS"
            [ -n "$DIGEST" ] && echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
